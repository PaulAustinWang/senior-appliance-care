function exportBackup(selected) {
  const blob=new Blob([JSON.stringify({format:'senior-care-offline',version:1,exported:new Date().toISOString(),records:selected},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='樂齡家電守護_備份_'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function validRecord(r) {
  const bounded=(v,max)=>typeof v==='string'&&v.length<=max;
  if(!r||typeof r!=='object'||!bounded(r.id,100)||!r.id||!bounded(r.name,40)||!r.name||!bounded(r.phone,20)||!bounded(r.address,200)||!bounded(r.model,100))return false;
  if(!['國語','台語','客語'].includes(r.language)||!['電鍋','電風扇','除濕機','電話機'].includes(r.appliance)||!bounded(r.date,10)||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!bounded(r.slot,30))return false;
  if(!Array.isArray(r.prefs)||!r.prefs.every(p=>preferencesList.includes(p))||!bounded(r.environment,1000)||!r.learned||typeof r.learned!=='object'||!bounded(r.helpNote,2000))return false;
  if(r.guide&&(!bounded(r.guide.model,100)||!Array.isArray(r.guide.steps)||r.guide.steps.length>6||!r.guide.steps.every(s=>bounded(s,200))||!bounded(r.guide.warning,1000)))return false;
  if(r.visit&&!['store','technician','date','time','note'].every(k=>bounded(r.visit[k],k==='note'?2000:100)))return false;
  if(r.warranty&&!['model','serial','start','end','terms'].every(k=>bounded(r.warranty[k],k==='terms'?2000:100)))return false;
  return true;
}
document.addEventListener('click',e=>{

document.addEventListener('change',e=>{if(e.target.id==='select-record'){currentId=e.target.value;save();render();}});
document.addEventListener('submit',async e=>{

      const r={id:id(),...v,prefs:[],environment:'',visit:null,guide:null,warranty:null,learned:{},helpNote:'',created:new Date().toISOString()};records.unshift(r);currentId=r.id;save();location.hash='visit';render();notice('服務需求已儲存。');return;

    if(f.id==='import-form') {
      const file=fd.get('backup');if(file.size>2_000_000)throw new Error('備份檔過大，請選擇 2 MB 以下的 JSON。');
      const data=JSON.parse(await file.text());if(data.format!=='senior-care-offline'||data.version!==1||!Array.isArray(data.records)||!data.records.every(validRecord))throw new Error('不是有效的服務紀錄備份檔。');
      const unique=new Map(data.records.map(r=>[r.id,r]));const added=[...unique.values()].filter(r=>!records.some(x=>x.id===r.id));
      if(records.length+added.length>100)throw new Error('匯入後超過 100 筆，請改匯入單筆備份。');records.push(...added);if(!currentId&&records.length)currentId=records[0].id;save();render();notice(`已加入 ${added.length} 筆；相同編號未覆蓋。`);return;
    }
    if(!b)throw new Error('請先建立服務需求。');
    if(f.id==='preferences-form'){b.prefs=fd.getAll('prefs');b.environment=v.environment;}
    if(f.id==='visit-form')b.visit=v;
    if(f.id==='guide-form'){const steps=v.steps.split('\n').map(s=>s.trim()).filter(Boolean);if(!steps.length||steps.length>6||steps.some(s=>s.length>200))throw new Error('請填寫 1 至 6 個步驟，每一步不超過 200 字。');b.guide={model:v.model,steps,warning:v.warning};}
    if(f.id==='practice-form')b.learned=Object.fromEntries(learnItems.map(([k])=>[k,fd.has(k)]));
    if(f.id==='warranty-form'){if(v.end<=v.start)throw new Error('保固迄日必須晚於起日。');b.warranty=v;}
    if(f.id==='help-note-form')b.helpNote=v.helpNote;
    save();render();notice('已儲存。');
  } catch(err) { notice(err instanceof SyntaxError?'備份格式不正確，請選擇匯出的服務紀錄檔。':err.message,true); }
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
render();
</script>
</body>
